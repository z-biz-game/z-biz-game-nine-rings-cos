name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The rule, the solver, the generator and the shipped pool are all pure ES modules: no
  # browser and no install step. Two rows are the reason this job exists:
  #   * solve.test.mjs — all 512 positions are searched exhaustively, the graph is proved to
  #     be a path, and every BFS distance is cross-checked against the classical closed form
  #     (2^(n+1)-(1 or 2))/3 for n = 1..12;
  #   * library.test.mjs — re-solves every level in js/data/levels.js, so a hand-edited par
  #     or a stale bake fails the build instead of shipping.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: npm run check
      - name: Suites
        run: npm run unit
      # The difficulty leg. `npm run balance` existed, and README quoted its output as the source
      # of every par band — but no CI surface ever ran the command, so the difficulty claim was
      # enforced only by a human remembering to type it. Measured cost of the full default run
      # (4 bands x 500 seeds + 64-level replay): 0.17s, so CI runs it exactly as locals do.
      - name: Doc citations reconcile (文档行号对账)
        run: node tools/docs-test.mjs

      - name: Balance (难度台架)
        run: npm run balance
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

  # The shell is only proven by driving a real page with real mouse events: the canvas hit
  # test, the illegal-click rule and the save file all live behind `window.rings`.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headless playtest
        env:
          SKIP_UNIT: 1
          WD_TIMEOUT: 240
        run: bash tools/verify.sh
